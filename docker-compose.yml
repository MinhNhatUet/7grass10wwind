services:
  # D-84: Postgres + pgvector thay SQLite. Mật khẩu đặt POSTGRES_PASSWORD trong .env (mặc định chỉ dùng cho máy dev).
  db:
    image: pgvector/pgvector:pg17
    container_name: edu04-db
    environment:
      - POSTGRES_DB=edu04
      - POSTGRES_USER=edu04
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edu04}
    ports:
      - "127.0.0.1:5432:5432"  # cho backend chạy ngoài Docker (make run); chỉ mở trên localhost
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu04 -d edu04"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edu04-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # D-84: Postgres + pgvector (service db). ./data vẫn mount cho file tải lên và corpus.
      - DATABASE_URL=postgresql+psycopg2://edu04:${POSTGRES_PASSWORD:-edu04}@db:5432/edu04
      # Conservative defaults for Gemini free-tier ingestion, including resumed jobs.
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-4}
      - EMBEDDING_PAUSE_SECONDS=${EMBEDDING_PAUSE_SECONDS:-15}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edu04-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  pgdata:
