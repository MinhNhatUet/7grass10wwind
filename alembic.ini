# Alembic (M-09). Chuỗi kết nối lấy từ DATABASE_URL của app (src/config.py) — KHÔNG ghi ở đây.
# App tự chạy `upgrade head` khi khởi động (src/db.py::init_db). Tạo migration mới:
#   alembic revision --autogenerate -m "mo ta"
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
